# Frontend nginx config
# - Serve SPA (history fallback ke index.html)

server {
	listen 7115;

    root /app/wwwroot;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}