# LadingPage nginx config
# - Serve SPA (history fallback ke index.html)

server {
	listen 7116;

    root /app;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}