services:
  ladingpage:
    build:
      context: ./LadingPage
      dockerfile: Dockerfile
    networks:
      - acaracyou_net
    depends_on:
      frontend:
        condition: service_started
    ports:
      - "7116:7116"

  frontend:
    build:
      context: ./Web
      dockerfile: Dockerfile
    networks:
      - acaracyou_net
    depends_on:
      backend:
        condition: service_started
    ports:
      - "7115:7115"

  backend:
    build:
      context: ./WebServer
      dockerfile: Dockerfile
    networks:
      - acaracyou_net
    environment:
      ASPNETCORE_HTTP_PORTS: 8081
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__MariadbConnection: Server=mariadb;Port=3306;Database=AcaraCyouDb;Uid=root;Pwd=admin;AllowUserVariables=True;
    depends_on:
      mariadb:
        condition: service_started
    volumes:
      - acaracyou_backend_volume:/app/UserUploads
    ports:
      - "8081:8081"

  mariadb:
    image: mariadb:latest
    environment:
      MARIADB_ROOT_PASSWORD: admin
    networks:
      - acaracyou_net
    volumes:
      - acaracyou_mariadb_volume:/var/lib/mysql
    ports:
      - "3306:3306"

volumes:
  acaracyou_mariadb_volume:
  acaracyou_backend_volume:
  
networks:
  acaracyou_net:
    driver: bridge